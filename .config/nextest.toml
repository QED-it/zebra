default-filter = 'package(zebrad) and test(=has_spending_transaction_ids)'

[profile.lightwalletd-test-suite]
slow-timeout = { period = "60m", terminate-after = 2 }
default-filter = 'package(zebrad) and test(=lightwalletd_test_suite)'

[profile.rpc-z-getsubtreesbyindex-snapshot]
slow-timeout = { period = "30m", terminate-after = 2 }
default-filter = 'package(zebrad) and test(=fully_synced_rpc_z_getsubtreesbyindex_snapshot_test)'

# --- Acceptance test settings ---

# Acceptance tests launch real zebrad processes, bind TCP ports and wait on
# wall-clock deadlines, which makes them the main source of intermittent
# failures. They get retries; the rest of the suite does not.
#
# `terminate-after` caps a single test at 10 minutes. Without it, a test that
# hangs instead of failing runs until the workflow-level timeout and takes the
# whole job down with it. The slowest healthy test here takes about 5 minutes.
[[profile.all-tests.overrides]]
filter = 'binary(acceptance)'
test-group = 'zebrad-acceptance'
retries = { backoff = "exponential", count = 2, delay = "5s", jitter = true }
slow-timeout = { period = "60s", terminate-after = 10 }

# --- Retries for known-flaky tests, default profile only ---

# `all-tests` deselects most of these, so this override mainly affects local
# runs started without an explicit profile.
#
# TODO: Remove once the underlying flakiness is fixed.
# Only add a test here after confirming it fails intermittently, never to
# silence a test that fails consistently.
[[profile.default.overrides]]
filter = '''
test(=sync_large_checkpoints_mempool_mainnet)
or test(=get_peer_info)
or test(=activate_mempool_mainnet)
'''
retries = 3

# --- Disabled tests ---

# `disconnects_from_misbehaving_peers` is deselected in `all-tests` above.
# It launches two zebrad nodes on deliberately incompatible custom testnets and
# asserts they connect and then disconnect. Three problems make it unsuitable
# for CI as written (zebrad/tests/acceptance.rs):
#
#   1. It sleeps for a fixed 20s and then asserts the nodes have connected,
#      instead of polling `getpeerinfo` until a deadline. Under load on a small
#      runner the connection is not always established in time.
#   2. A panic does not end the test. The child nodes run in `spawn_blocking`
#      loops that exit only when the `is_finished` flag is set at the end of the
#      test, which a panic skips, so the binary hangs until it is killed.
#   3. Neither `spawn_blocking` result is joined, so node startup errors are
#      silently discarded and never appear in the failure output.
#
# Re-enable once these are fixed upstream.
