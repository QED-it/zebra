name: Zebra EC2 Ops

on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [status, logs, genesis, restart, recreate, start, stop, deploy, promote, demote]
      image_tag:
        description: deploy only
        default: latest
      instance_id:
        description: Target a specific instance. Empty targets the leader.
        default: ""
      confirm:
        description: Required for stop/demote — type the action name
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_OIDC_OPS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Guard destructive actions
        if: contains(fromJSON('["stop","demote"]'), inputs.action)
        env:
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [ "$CONFIRM" = "$ACTION" ] || { echo "::error::set confirm=$ACTION"; exit 1; }

      # Empty instance_id resolves to the single Role=leader instance. Fails
      # loudly on 0 or >1 rather than picking an arbitrary one. promote is
      # exempt from the Role filter: it is what creates a leader, and after a
      # demote there is none.
      - id: target
        env:
          ACTION: ${{ inputs.action }}
          INSTANCE_ID: ${{ inputs.instance_id }}
        run: |
          if [ -n "$INSTANCE_ID" ]; then
            printf '%s' "$INSTANCE_ID" | grep -Eq '^i-[0-9a-f]{8,17}$' \
              || { echo "::error::invalid instance id: $INSTANCE_ID"; exit 1; }
            ID="$INSTANCE_ID"
          else
            FILTERS=("Name=tag:Name,Values=zebra-testnet"
                     "Name=instance-state-name,Values=running")
            [ "$ACTION" = promote ] || FILTERS+=("Name=tag:Role,Values=leader")
            ID=$(aws ec2 describe-instances --filters "${FILTERS[@]}" \
              --query 'Reservations[].Instances[].InstanceId' --output text)
            [ "$(echo $ID | wc -w)" -eq 1 ] \
              || { echo "::error::expected 1 target for $ACTION, got: '$ID'"; exit 1; }
          fi
          echo "id=$ID" >> $GITHUB_OUTPUT
          echo "::notice::target $ID"

      - id: run
        env:
          ACTION: ${{ inputs.action }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          TARGET_ID: ${{ steps.target.outputs.id }}
        run: |
          printf '%s' "$IMAGE_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$' \
            || { echo "::error::invalid image tag: $IMAGE_TAG"; exit 1; }
          CMD=$(aws ssm send-command --instance-ids "$TARGET_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -nc --arg c "bash /opt/zebra/ops.sh $ACTION $IMAGE_TAG" '{commands:[$c]}')" \
            --query Command.CommandId --output text)
          for _ in $(seq 1 180); do
            INV=$(aws ssm get-command-invocation --command-id "$CMD" \
              --instance-id "$TARGET_ID" 2>/dev/null || echo '{}')
            ST=$(jq -r '.Status // "Pending"' <<<"$INV")
            case "$ST" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          jq -r '[.Status, .StandardOutputContent, .StandardErrorContent] | @tsv' <<<"$INV" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$ST" = Success ] || { echo "::error::ops.sh $ACTION -> $ST"; exit 1; }
