name: Basic checks

on: [push]

permissions:
  contents: read

# Only keep the newest run per branch: older runs test superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      # Run both matrix legs to completion: a failure in one should not cancel
      # the other, since they exercise different feature configurations.
      fail-fast: false
      matrix:
        nu7:
          - true
          - false

    env:
      # Use system-installed RocksDB library instead of building from scratch
      ROCKSDB_LIB_DIR: /usr/lib
      # Use system-installed Snappy library for compression in RocksDB
      SNAPPY_LIB_DIR: /usr/lib/x86_64-linux-gnu

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show system resource summary (before cleanup)
        run: |
          df -h
          free -h
          lscpu | egrep 'Model name|Socket|Thread|Core|CPU\(s\)'

      - name: Free disk space (safe cleanup for Rust CI)
        run: |
          # Remove heavy preinstalled SDKs and toolchains
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true  # preinstalled tool caches
          df -h

      - name: Install dependencies on Ubuntu
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler librocksdb-dev

      - name: Install formatting & linting tools
        run: rustup component add rustfmt clippy

      - name: Verify working directory is clean
        run: git diff --exit-code

      - name: Strip nu7/tx_v6 flags from config
        if: ${{ !matrix.nu7 }}
        run: |
          sed -i 's|.*"--cfg", .feature="tx_v6".*|# &|' .cargo/config.toml
          sed -i 's|.*"--cfg", "zcash_unstable=\\"nu7\\"".*|# &|' .cargo/config.toml
          # Fail loudly if the patterns stop matching: a silent no-op would make
          # this leg build with the ZSA flags still on, so both matrix legs
          # would test the same configuration without anyone noticing.
          if git diff --quiet .cargo/config.toml; then
            echo "::error::nu7/tx_v6 flags not found in .cargo/config.toml"
            exit 1
          fi

      - name: Install cargo-nextest
        uses: taiki-e/install-action@305bebabd4457bed9b82541755f034994382465b # v2.68.10
        with:
          tool: cargo-nextest

      - name: Run tests
        env:
          # Selects the CI test set from .config/nextest.toml. Without it,
          # nextest falls back to [profile.default] and also runs the stateful
          # and network-dependent tests, which belong to the integration
          # workflows.
          NEXTEST_PROFILE: all-tests
        run: |
          # Backstop only: nextest enforces its own per-test timeouts. This
          # budget also covers compilation, which takes several minutes.
          # -k sends SIGKILL if the process ignores the initial SIGTERM.
          #
          # The acceptance tests are excluded until Ironwood support is
          # merged: Mainnet and Testnet have activated NU6.3 (heights
          # 3_428_143 / 4_134_000), and this v5.2.0-based branch cannot
          # verify blocks past those heights.
          timeout -k 60s --preserve-status 90m \
            cargo nextest run --workspace --locked -E 'not binary(=acceptance)'

      - name: Run doc tests
        run: |
          timeout -k 60s --preserve-status 30m \
            cargo test --doc --workspace --locked

      - name: Run doc check
        run: cargo doc --workspace --no-deps --all-features --document-private-items --locked

      - name: Run format check
        run: cargo fmt -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --features "default-release-binaries proptest-impl lightwalletd-grpc-tests zebra-checkpoints"

      # Runs even when an earlier step failed, so the checkout is left in the
      # state the next job on this machine expects.
      - name: Restore cargo config
        if: ${{ !cancelled() }}
        run: git checkout -- .cargo/config.toml

      - name: Verify working directory is clean
        run: git diff --exit-code

      # Runs even when an earlier step failed: disk and memory numbers are most
      # useful when diagnosing a failed run, and a step with no `if` defaults to
      # running only on success.
      - name: Show system resource summary
        if: always()
        run: |
          df -h
          free -h
          lscpu | egrep 'Model name|Socket|Thread|Core|CPU\(s\)'
